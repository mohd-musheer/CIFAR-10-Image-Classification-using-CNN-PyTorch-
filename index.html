<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision | Image Classifier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .upload-area {
            border: 3px dashed rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffffff;
            transform: scale(1.02);
        }

        .upload-area.dragover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #23d5ab;
        }

        .gradient-text {
            background: linear-gradient(to right, #ffffff, #d1d5db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .progress-fill {
            transition: width 0.3s ease-in-out;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="glass-card p-10 max-w-2xl w-full mx-4 text-white text-center">
        <div class="mb-8">
            <h1 class="text-5xl font-extrabold mb-4 gradient-text uppercase tracking-tighter">AI Visual Predictor</h1>
            <p class="text-xl font-medium opacity-90">
                Detects: <span class="text-yellow-300">Planes • Cars • Cats • Dogs • Ships • deer • birds • frog • truck • horse</span>
            </p>
        </div>

        <div id="dropZone" class="upload-area rounded-3xl p-12 mb-8 flex flex-col items-center justify-center relative overflow-hidden">
            <input type="file" id="fileInput" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept="image/*">
            
            <div id="uploadPrompt" class="flex flex-col items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 mb-4 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span class="text-2xl font-semibold">Drop image here</span>
                <span class="text-sm opacity-60 mt-2">or click to browse from files</span>
            </div>

            <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-cover rounded-2xl" />
        </div>

        <div id="loadingUI" class="hidden mb-8">
            <div class="flex justify-between mb-2">
                <span class="text-sm font-bold uppercase tracking-widest">Processing Image</span>
                <span id="progressPercent" class="text-sm font-bold">0%</span>
            </div>
            <div class="w-full bg-black/20 rounded-full h-4 overflow-hidden">
                <div id="progressBar" class="bg-white h-full progress-fill" style="width: 0%"></div>
            </div>
        </div>

        <div id="result" class="hidden transform transition-all duration-500 scale-110">
            <div class="bg-white/20 rounded-2xl py-6 px-4">
                <p class="text-sm uppercase tracking-widest opacity-70 mb-1">Our AI predicts a...</p>
                <h2 class="text-6xl font-black capitalize mb-2" id="predictionText"></h2>
                <div class="inline-block px-4 py-1 bg-green-500 rounded-full text-sm font-bold" id="confidenceLabel">
                    <span id="confidenceText"></span> Confidence
                </div>
            </div>
            <button onclick="location.reload()" class="mt-6 text-sm underline opacity-50 hover:opacity-100">Reset and try another</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const imagePreview = document.getElementById('imagePreview');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const loadingUI = document.getElementById('loadingUI');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const resultDiv = document.getElementById('result');

        // Drag and Drop Visual Feedback
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Show Preview & Hide Prompt
            const reader = new FileReader();
            reader.onload = (event) => {
                imagePreview.src = event.target.result;
                imagePreview.classList.remove('hidden');
                uploadPrompt.classList.add('hidden');
            };
            reader.readAsDataURL(file);

            // Prepare for Prediction
            loadingUI.classList.remove('hidden');
            resultDiv.classList.add('hidden');
            
            // Artificial progress bar for better UX
            let progress = 0;
            const interval = setInterval(() => {
                progress += (100 - progress) * 0.1;
                progressBar.style.width = `${progress}%`;
                progressPercent.innerText = `${Math.round(progress)}%`;
            }, 150);

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                clearInterval(interval);
                progressBar.style.width = '100%';
                progressPercent.innerText = '100%';

                setTimeout(() => {
                    loadingUI.classList.add('hidden');
                    resultDiv.classList.remove('hidden');
                    document.getElementById('predictionText').innerText = data.prediction;
                    document.getElementById('confidenceText').innerText = `${data.confidence}%`;
                }, 600);

            } catch (error) {
                console.error("Error:", error);
                alert("Connection failed! Check if FastAPI server is running.");
                clearInterval(interval);
                loadingUI.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
